name: Compare One UI 8 and Lenovo VINTF evidence (fast)
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previously verified small evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stock donor report
          gh run download 40903127259 --repo "${{ github.repository }}" --name tbj716f-super-reconstruction-report --dir stock
          gh run download 40912649653 --repo "${{ github.repository }}" --name oneui8-donor-analysis --dir donor
          test -s stock/vendor-vintf/manifest.xml
          test -s donor/oneui8-donor-inventory.json
      - name: Compare and classify evidence without falsely failing extraction
        shell: bash
        run: |
          set -uo pipefail
          if python3 tools/compare_oneui8_vendor_vintf.py donor/oneui8-donor-inventory.json stock/vendor-vintf/manifest.xml --output report/oneui8-preliminary-vintf-gap.json; then
            rc=0
          else
            rc=$?
          fi
          echo "Comparator exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 2 ]; then
            echo "### Inconclusive: insufficient matrix evidence, not a compatibility failure" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 0 ]; then
            echo "### Preliminary HAL name comparison completed (NOT boot approval)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Comparator error: inspect the report" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          cp stock/vendor-vintf/fragment-summary.json report/fragment-summary.json
          cp stock/vendor-vintf/fragment-list.txt report/fragment-list.txt
          cp stock/vendor-vintf/directory-list.txt report/directory-list.txt
      - name: Produce HAL adaptation diagnostics
        run: |
          python3 tools/report_oneui8_hal_adaptation.py donor/oneui8-donor-inventory.json stock/vendor-vintf/manifest.xml --output report/hal-adaptation-diagnostics.json
      - name: Classify HAL optionality using raw donor matrices when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/matrix-classification
          found=0
          for matrix in donor/raw-matrices/compatibility_matrix.*.xml; do
            [ -f "$matrix" ] || continue
            found=1
            name="$(basename "$matrix" .xml)"
            python3 tools/classify_oneui8_matrix_hals.py "$matrix" stock/vendor-vintf/manifest.xml --output "report/matrix-classification/$name.json"
          done
          if [ "$found" -eq 0 ]; then
            echo 'Raw donor matrix XML absent from pinned older artifact; rerun inspect-oneui8-donor workflow and update donor run ID before classification' | tee report/matrix-classification/NOT_AVAILABLE.txt
          fi
      - name: Audit classified HAL evidence
        run: python3 tools/audit_oneui8_hal_evidence.py report/matrix-classification --output report/hal-evidence-audit.json
      - name: Stage partial VINTF filesystem for future official validation
        run: |
          python3 tools/stage_partial_vintf_tree.py donor stock report/vintf-partial-tree
      - name: Analyze framework manifest HAL declarations
        run: python3 tools/analyze_oneui8_framework_manifests.py report/vintf-partial-tree --output report/framework-manifest-hal-analysis.json
      - name: Upload small evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui8-lenovo-vintf-evidence
          path: report/
          retention-days: 7

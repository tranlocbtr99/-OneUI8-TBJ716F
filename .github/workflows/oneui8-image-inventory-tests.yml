name: One UI 8 image inventory tests
on:
  push:
    paths:
      - 'tools/inventory_oneui8_system_image.py'
      - 'tests/test_inventory_oneui8_system_image.py'
      - '.github/workflows/oneui8-image-inventory-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit test static One UI 8 image inventory
        run: python3 -m unittest discover -s tests -p 'test_inventory_oneui8_system_image.py' -v

name: ARM64 KVM host feasibility
on:
  workflow_dispatch:
jobs:
  arm64-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check native ARM64 virtualization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          {
            echo "architecture=$(uname -m)"
            echo "kernel=$(uname -r)"
            echo "kvm_device=$(test -c /dev/kvm && echo present || echo missing)"
            echo "kvm_access=$(test -r /dev/kvm && test -w /dev/kvm && echo accessible || echo inaccessible)"
            echo "cpu_count=$(nproc)"
            free -h
            df -h .
          } | tee output/arm64-host.txt
          python3 - <<'PY'
          import json,os,platform
          from pathlib import Path
          arch=platform.machine()
          kvm=Path("/dev/kvm")
          eligible=arch in ("aarch64","arm64") and kvm.is_char_device() and os.access(kvm,os.R_OK|os.W_OK)
          result={"architecture":arch,"kvm_exists":kvm.is_char_device(),
                  "kvm_accessible":os.access(kvm,os.R_OK|os.W_OK),
                  "arm64_kvm_prerequisites_met":eligible,
                  "cuttlefish_boot_verified":False,
                  "oneui_boot_verified":False,
                  "note":"KVM eligibility does not guarantee Cuttlefish host packages or device images will work."}
          Path("output/arm64-host.json").write_text(json.dumps(result,indent=2)+"\n")
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-kvm-feasibility
          path: output/
          retention-days: 7

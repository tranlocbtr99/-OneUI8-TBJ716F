name: Inspect TB-J716F stock vendor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-tbj716f-stock.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download stock archive
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://mirrors-obs-1.lolinet.com/firmware/lenowow/2021/Tab_P11_Pro_2021/TB-J716F/TB-J716F_CN_OPEN_USER_Q00209.3_R_ZUI_13.0.430_ST_220113_qpst.zip' -o stock.zip
          unzip -Z1 stock.zip > archive-contents.txt
          grep -Ei 'vendor|super|rawprogram' archive-contents.txt | head -100
          mkdir -p stock-evidence
          cp archive-contents.txt stock-evidence/
          for entry in rawprogram0.xml rawprogram1.xml rawprogram2.xml rawprogram3.xml rawprogram4.xml rawprogram5.xml rawprogram_fullupgrade.xml; do
            if grep -Fxq "$entry" archive-contents.txt; then
              unzip -p stock.zip "$entry" > "stock-evidence/$entry"
            fi
          done
          python3 - <<'PY'
          import json, glob, xml.etree.ElementTree as ET
          rows=[]
          for path in glob.glob('stock-evidence/rawprogram*.xml'):
              root=ET.parse(path).getroot()
              for node in root.iter():
                  if node.tag.lower()=='program' and ('super' in node.get('filename','').lower() or 'super' in node.get('label','').lower()):
                      rows.append({'xml':path,**node.attrib})
          with open('stock-evidence/super-program-entries.json','w') as f:
              json.dump(rows,f,indent=2)
          print(json.dumps(rows,indent=2))
          PY
          python3 - <<'PY'
          import zipfile,struct,json
          entries=[]
          with zipfile.ZipFile('stock.zip') as z:
              for i in range(1,7):
                  name=f'super_{i}.img'
                  with z.open(name) as fp:
                      header=fp.read(64)
                  magic=struct.unpack('<I',header[:4])[0]
                  info={'file':name,'compressed_bytes':z.getinfo(name).compress_size,'uncompressed_bytes':z.getinfo(name).file_size,'header_hex':header[:32].hex(),'android_sparse':magic==0xed26ff3a}
                  if info['android_sparse'] and len(header)>=28:
                      vals=struct.unpack('<I4H4I',header[:28]);info['sparse_header']={'major':vals[1],'minor':vals[2],'file_header_size':vals[3],'chunk_header_size':vals[4],'block_size':vals[5],'total_blocks':vals[6],'total_chunks':vals[7]}
                  entries.append(info)
          with open('stock-evidence/super-image-headers.json','w') as fp:json.dump(entries,fp,indent=2)
          print(json.dumps(entries,indent=2))
          PY
      - name: Validate vendor candidate super_5.img
        run: |
          set -euo pipefail
          unzip -p stock.zip super_5.img > candidate.img
          python3 - <<'PY'
          import hashlib,json,struct
          p='candidate.img'
          with open(p,'rb') as f:
              h=hashlib.file_digest(f,'sha256').hexdigest()
              f.seek(1080)
              ext4_magic=f.read(2).hex()
          result={'candidate':'super_5.img','sha256':h,'expected_vendor_sha256':'8fa552fda356d2407055ce2fb5ebc383e7122b5bca3825ff985b040ad49eeab1','sha256_matches':h=='8fa552fda356d2407055ce2fb5ebc383e7122b5bca3825ff985b040ad49eeab1','ext4_magic_at_1080':ext4_magic,'ext4_magic_valid':ext4_magic=='53ef'}
          with open('stock-evidence/vendor-candidate-validation.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
          if [ "$(python3 -c "import json;print(json.load(open('stock-evidence/vendor-candidate-validation.json'))['ext4_magic_valid'])")" = True ]; then
            mkdir -p stock-evidence/vendor-vintf
            debugfs -R 'ls -p /etc/vintf' candidate.img > stock-evidence/vendor-vintf/listing.txt 2>&1 || true
            debugfs -R 'cat /etc/vintf/manifest.xml' candidate.img > stock-evidence/vendor-vintf/manifest.xml 2>stock-evidence/vendor-vintf/debugfs-errors.txt || true
          fi
      - name: Upload partition inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbj716f-stock-partition-inventory
          path: stock-evidence/
          retention-days: 7

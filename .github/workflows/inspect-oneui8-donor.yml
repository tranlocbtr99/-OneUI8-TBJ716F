name: Inspect verified One UI 8 donor image
on:
  workflow_dispatch:
    inputs:
      direct_url:
        description: "Authorized direct HTTPS link to .img.zst (not Google Drive folder page)"
        required: false
        type: string
      drive_file_id:
        description: "Public Google Drive file ID (individual file, not folder)"
        required: false
        default: "13z87bzceVOA71cHmdXKKyN7F7yNYf1Yn"
        type: string
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install image inspection dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd e2fsprogs
      - name: Install Google Drive public-file downloader
        if: inputs.drive_file_id != ''
        run: python3 -m pip install --user gdown==5.2.0
      - name: Download exact pinned donor and check checksum
        env:
          URL: ${{ inputs.direct_url }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donor-output
          if [[ -n "$URL" && -z "$DRIVE_FILE_ID" ]]; then
            [[ "$URL" == https://* ]] || { echo "HTTPS required"; exit 1; }
            curl --fail --location --retry 2 --max-time 1800 --output donor.img.zst "$URL"
          elif [[ -z "$URL" && "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]{15,}$ ]]; then
            python3 -m gdown --id "$DRIVE_FILE_ID" -O donor.img.zst
          else
            echo "Supply exactly one source: direct_url or drive_file_id"; exit 1
          fi
          test "$(stat -c%s donor.img.zst)" -eq 2683294844 || { echo "Unexpected compressed size"; exit 1; }
          echo "b9155186e0bf0ef88ef30181395c7be85f854edfe7bddccf6029a8941b8274b1  donor.img.zst" | sha256sum -c -
      - name: Decompress and verify exact donor
        shell: bash
        run: |
          set -euo pipefail
          zstd -d --stdout donor.img.zst > donor.img
          test "$(stat -c%s donor.img)" -eq 6845104128
          echo "6946aa3fdcafa3475c1809b640f0df5c  donor.img" | md5sum -c -
          python3 tools/verify_oneui8_donor.py donor.img --output donor-output/donor-preflight.json
      - name: Inventory verified One UI 8 filesystem
        run: python3 tools/inventory_oneui8_system_image.py donor.img --output donor-output/oneui8-donor-inventory.json
      - name: Summarize VINTF framework matrices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("donor-output/oneui8-donor-inventory.json").read_text())
          matrices = {}
          for key, item in report["files"].items():
              if "matrix" in key and item.get("present"):
                  matrices[key] = item.get("vintf_summary", {})
          out = {"framework_matrices": matrices,
                 "warning": "Metadata only; no vendor comparison or boot validation"}
          Path("donor-output/oneui8-vintf-matrices.json").write_text(
              json.dumps(out, indent=2) + "\\n")
          print(json.dumps(out, indent=2))
          PY
      - name: Preserve raw donor VINTF matrices for optionality analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donor-output/raw-matrices
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          for level in range(1, 9):
              path=f'/system/etc/vintf/compatibility_matrix.{level}.xml'
              result=subprocess.run(['debugfs','-R','cat '+path,'donor.img'],capture_output=True)
              if result.returncode or not result.stdout:
                  continue
              if len(result.stdout)>1024*1024:
                  raise SystemExit(f'Matrix too large: {path}')
              root=ET.fromstring(result.stdout)
              if root.tag!='compatibility-matrix' or root.get('type')!='framework':
                  raise SystemExit(f'Unexpected matrix type: {path}')
              (Path('donor-output/raw-matrices')/f'compatibility_matrix.{level}.xml').write_bytes(result.stdout)
              print('Preserved',path)
          PY
      - name: Upload reports only, never proprietary images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui8-donor-analysis
          path: donor-output/
          if-no-files-found: ignore
          retention-days: 7

name: Vendor ZIP evidence extraction tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/extract_vendor_evidence.py'
      - 'tools/inventory_firmware_zip.py'
      - 'tools/probe_partition_formats.py'
      - 'tools/check_firmware_identity.py'
      - 'tools/inspect_sparse_structure.py'
      - 'tests/test_extract_vendor_evidence.py'
      - 'tests/test_inventory_firmware_zip.py'
      - 'tests/test_probe_partition_formats.py'
      - 'tests/test_check_firmware_identity.py'
      - 'tests/test_firmware_pipeline.py'
      - 'tests/test_inspect_sparse_structure.py'
      - '.github/workflows/vendor-zip-evidence-tests.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test offline ZIP evidence extraction
        run: |
          python3 -m unittest discover -s tests -p 'test_extract_vendor_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_inventory_firmware_zip.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_partition_formats.py' -v
          python3 -m unittest discover -s tests -p 'test_check_firmware_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_firmware_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_inspect_sparse_structure.py' -v

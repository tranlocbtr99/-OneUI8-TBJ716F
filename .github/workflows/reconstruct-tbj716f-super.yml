name: Reconstruct TB-J716F super (read-only)
on:
  workflow_dispatch:
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download public TB-J716F firmware
        run: |
          curl --fail --location --retry 2 --proto '=https' --proto-redir '=https' --max-time 3000 --output stock.zip 'https://mirrors-obs-1.lolinet.com/firmware/lenowow/2021/Tab_P11_Pro_2021/TB-J716F/TB-J716F_CN_OPEN_USER_Q00209.3_R_ZUI_13.0.430_ST_220113_qpst.zip'
          unzip -tq stock.zip
      - name: Preflight stock super segment structure
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          python3 tools/inspect_stock_super_chunk_headers.py stock.zip --output report/super-segment-headers.json
          python3 - <<'PY'
          import json,struct,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          with zipfile.ZipFile('stock.zip') as z:
              members=set(z.namelist())
              name='rawprogram_unsparse0.xml'
              result={'xml_present':name in members,'segments':[],'reconstruction_supported':False}
              if name in members:
                  root=ET.fromstring(z.read(name))
                  for node in root.iter('program'):
                      a=node.attrib
                      if a.get('label','').lower()!='super' or not a.get('filename'):
                          continue
                      fn=a['filename']
                      record={'file':fn,'start_sector':a.get('start_sector'),'sectors':a.get('num_partition_sectors'),'sector_bytes':a.get('SECTOR_SIZE_IN_BYTES'),'present':fn in members}
                      if fn in members:
                          with z.open(fn) as src:
                              record['android_sparse']=src.read(4)==struct.pack('<I',0xED26FF3A)
                          record['file_bytes']=z.getinfo(fn).file_size
                      result['segments'].append(record)
              issues=[]
              spans=[]
              for entry in result['segments']:
                  try:
                      start=int(entry['start_sector'])
                      count=int(entry['sectors'])
                      unit=int(entry['sector_bytes'])
                      if start<0 or count<=0 or unit not in (512,4096):
                          raise ValueError('invalid sector geometry')
                      spans.append((start,start+count,unit,entry['file']))
                      if not entry['present']:
                          issues.append('missing segment: '+entry['file'])
                      elif entry['android_sparse']:
                          issues.append('Android sparse unsupported: '+entry['file'])
                      elif entry['file_bytes']!=count*unit:
                          issues.append('raw length mismatch: '+entry['file'])
                  except (TypeError,ValueError) as exc:
                      issues.append('invalid mapping: '+entry['file']+': '+str(exc))
              if spans and len({s[2] for s in spans})!=1:
                  issues.append('mixed sector sizes')
              spans.sort()
              for left,right in zip(spans,spans[1:]):
                  if right[0]<left[1]:
                      issues.append('overlapping segments: '+left[3]+' / '+right[3])
              if not spans:
                  issues.append('no super segments')
              result['issues']=issues
              result['reconstruction_supported']=not issues
              Path('report/reconstruction-preflight.json').write_text(json.dumps(result,indent=2)+chr(10))
              Path('report/reconstruction-supported.txt').write_text('true' if result['reconstruction_supported'] else 'false')
              print(json.dumps(result,indent=2))
          PY
          if [[ "$(cat report/reconstruction-supported.txt)" == "true" ]]; then
            echo 'reconstruct=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reconstruct=false' >> "$GITHUB_OUTPUT"
            printf '%s\\n' 'SKIPPED: missing sector mapping, missing segments, or Android sparse input unsupported by the current raw-only reconstruction tool. No image guessed or flashed.' > report/reconstruction-preflight.txt
            cat report/reconstruction-preflight.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Reconstruct and inspect local super
        if: steps.preflight.outputs.reconstruct == 'true'
        run: |
          mkdir -p report
          python3 tools/reconstruct_qfil_super.py stock.zip --output super.img --report report/super-reconstruction.json
          file super.img | tee report/super-file-type.txt
          sha256sum super.img > report/super-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          h=Path('super.img').open('rb').read(4096)
          print('First 64 bytes:', h[:64].hex())
          Path('report/super-first64-hex.txt').write_text(h[:64].hex()+'\\n')
          PY
      - name: Probe LP geometry and verify checksum
        if: steps.preflight.outputs.reconstruct == 'true'
        run: python3 tools/probe_lp_geometry.py super.img --output report/lp-geometry.json
      - name: Validate LP metadata tables and enumerate vendor extents
        if: steps.preflight.outputs.reconstruct == 'true'
        run: python3 tools/inspect_lp_metadata.py super.img --output report/lp-partitions.json
      - name: Report logical partition extent budget
        if: steps.preflight.outputs.reconstruct == 'true'
        run: python3 tools/report_lp_partition_budget.py report/lp-partitions.json --output report/lp-partition-budget.json
      - name: Extract stock vendor_a (local read-only)
        if: steps.preflight.outputs.reconstruct == 'true'
        run: |
          python3 tools/extract_lp_partition.py super.img --partition vendor_a --output vendor_a.img --report report/vendor-a-extraction.json
          file vendor_a.img | tee report/vendor-a-file-type.txt
          python3 - <<'PY'
          from pathlib import Path
          h=Path('vendor_a.img').open('rb').read(4096)
          Path('report/vendor-a-first64-hex.txt').write_text(h[:64].hex()+chr(10))
          print('vendor_a first 64 bytes:', h[:64].hex())
          PY
      - name: Extract stock vendor VINTF manifest (read-only)
        if: steps.preflight.outputs.reconstruct == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/vendor-vintf
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs
          debugfs -R 'stat /etc/vintf/manifest.xml' vendor_a.img > report/vendor-vintf/manifest-stat.txt 2>&1
          debugfs -R 'dump /etc/vintf/manifest.xml report/vendor-vintf/manifest.xml' vendor_a.img > report/vendor-vintf/debugfs-dump-log.txt 2>&1
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('report/vendor-vintf/manifest.xml')
          if not p.is_file() or not p.stat().st_size:
              raise SystemExit('Missing vendor manifest')
          root=ET.parse(p).getroot()
          if root.tag!='manifest' or root.attrib.get('type')!='device':
              raise SystemExit('Unexpected VINTF manifest')
          hals=[]
          for hal in root.findall('hal'):
              hals.append({'name':hal.findtext('name'), 'format':hal.get('format'),
                           'versions':[v.text for v in hal.findall('version')]})
          result={'target_level':root.get('target-level'),'hal_count':len(hals),'hals':hals}
          Path('report/vendor-vintf/manifest-summary.json').write_text(json.dumps(result,indent=2)+chr(10))
          print('Stock vendor target-level:',result['target_level'])
          print('Stock vendor HAL count:',len(hals))
          if not result['target_level'] or not hals:
              raise SystemExit('Stock manifest lacks target-level or HAL entries')
          PY
      - name: Inventory vendor VINTF fragments and compatibility evidence
        if: steps.preflight.outputs.reconstruct == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/vendor-vintf/fragments
          debugfs -R 'ls -p /etc/vintf' vendor_a.img > report/vendor-vintf/directory-list.txt 2>&1
          debugfs -R 'ls -p /etc/vintf/manifest' vendor_a.img > report/vendor-vintf/fragment-list.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, json
          listing=Path('report/vendor-vintf/fragment-list.txt').read_text(errors='replace')
          names=sorted(set(re.findall(r'([A-Za-z0-9_.+-]+\\.xml)', listing)))
          status=[]
          for name in names:
              dest=Path('report/vendor-vintf/fragments')/name
              proc=subprocess.run(['debugfs','-R',f'dump /etc/vintf/manifest/{name} {dest}','vendor_a.img'],capture_output=True,text=True)
              if proc.returncode or not dest.is_file() or not dest.stat().st_size:
                  raise SystemExit(f'Unable to read VINTF fragment {name}: {proc.stderr}')
              status.append({'file':name,'bytes':dest.stat().st_size})
          Path('report/vendor-vintf/fragment-summary.json').write_text(json.dumps({'discovered':names,'extracted':status,'directory_listing':listing},indent=2)+chr(10))
          print('Extracted vendor manifest fragments:',len(status))
          PY
      - name: Compare stock Lenovo VINTF against One UI 8 donor
        if: steps.preflight.outputs.reconstruct == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p donor-evidence
          gh run download 40831143271 --repo "${{ github.repository }}" --name oneui8-donor-analysis --dir donor-evidence
          test -s donor-evidence/oneui8-donor-inventory.json
          python3 tools/compare_oneui8_vendor_vintf.py donor-evidence/oneui8-donor-inventory.json report/vendor-vintf/manifest.xml --output report/vendor-vintf/oneui8-preliminary-vintf-gap.json
      - name: Upload metadata only, never firmware images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbj716f-super-reconstruction-report
          path: report/
          if-no-files-found: ignore
          retention-days: 7
